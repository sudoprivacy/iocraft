name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  text-rendering:
    name: Text rendering (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test -p iocraft --all-features
      - run: cargo clippy -p iocraft --all-features -- -D warnings
      - run: cargo doc -p iocraft --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
